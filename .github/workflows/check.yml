name: check
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run the skill checker
        run: node checker/check.mjs
      - name: Prove the checker can fail
        run: node checker/selftest.mjs
      - name: Prove the transcript grader can fail
        run: node verify/selftest.mjs
